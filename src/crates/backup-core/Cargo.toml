[package]
name = "backup-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
globset = "0.4"
zip = "2"
tar = "0.4"
flate2 = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = "2"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"